name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Job 1: Secret Detection
  # Runs first to prevent secrets from being committed
  # ============================================
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================
  # Job 2: Rust Security (auth-service)
  # CVE scanning, static analysis, formatting, tests
  # ============================================
  rust-security:
    name: Rust Security
    runs-on: ubuntu-latest
    needs: secret-detection
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            auth-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('auth-service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo audit (CVE check)
        run: cargo audit

      - name: Run Clippy with security lints
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unwrap_in_result \
            -D clippy::indexing_slicing \
            -W clippy::pedantic

      - name: Run tests
        run: cargo test --all-features

  # ============================================
  # Job 3: Node.js Security (auth-proxy)
  # npm audit and ESLint security rules
  # ============================================
  node-proxy-security:
    name: Node.js Proxy Security
    runs-on: ubuntu-latest
    needs: secret-detection
    defaults:
      run:
        working-directory: auth-proxy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auth-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Install ESLint security plugin
        run: npm install --save-dev eslint-plugin-security

      - name: Run ESLint with security rules
        run: |
          npx eslint src/ \
            --config eslint.security.config.js \
            --max-warnings 0

  # ============================================
  # Job 4: Frontend Security (auth-web)
  # npm audit, ESLint, TypeScript build
  # ============================================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest
    needs: secret-detection
    defaults:
      run:
        working-directory: auth-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auth-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Check for hardcoded secrets in frontend
        run: |
          # Search for potential hardcoded secrets
          if grep -rE "(api[_-]?key|secret|password|token)\s*[:=]\s*['\"][^'\"]+['\"]" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "process.env" | grep -v "import.meta.env"; then
            echo "::error::Potential hardcoded secrets found in frontend code!"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  # ============================================
  # Job 5: Security Headers Validation
  # Verify security headers are properly configured
  # ============================================
  security-headers:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    needs: [rust-security, node-proxy-security, frontend-security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate security headers in auth-service
        run: |
          echo "Checking for security headers configuration..."

          # Check for X-Content-Type-Options
          if ! grep -rq "X-Content-Type-Options" auth-service/src/; then
            echo "::warning::X-Content-Type-Options header not found in auth-service"
          fi

          # Check for X-Frame-Options
          if ! grep -rq "X-Frame-Options" auth-service/src/; then
            echo "::warning::X-Frame-Options header not found in auth-service"
          fi

          # Check for Content-Security-Policy
          if ! grep -rq "Content-Security-Policy" auth-service/src/; then
            echo "::warning::Content-Security-Policy header not found in auth-service"
          fi

      - name: Validate cookie security in auth-proxy
        run: |
          echo "Checking for secure cookie configuration..."

          # Check for HttpOnly cookies
          if ! grep -rq "httpOnly" auth-proxy/src/; then
            echo "::warning::HttpOnly cookie flag not found in auth-proxy"
          fi

          # Check for SameSite attribute
          if ! grep -rq "sameSite" auth-proxy/src/; then
            echo "::warning::SameSite cookie attribute not found in auth-proxy"
          fi

          # Check for Secure flag
          if ! grep -rq "secure" auth-proxy/src/; then
            echo "::warning::Secure cookie flag not found in auth-proxy"
          fi

      - name: Summary
        run: |
          echo "Security headers validation complete."
          echo "Review any warnings above and ensure all security headers are properly configured."

  # ============================================
  # Job 6: SAST Analysis (Semgrep)
  # Static Application Security Testing
  # ============================================
  sast-analysis:
    name: SAST Analysis
    runs-on: ubuntu-latest
    needs: security-headers
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/rust
            p/typescript
            p/jwt
            p/owasp-top-ten
          generateSarif: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
