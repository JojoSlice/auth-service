# cargo-deny configuration for auth-service
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ============================================
# Advisories - Check for known vulnerabilities
# ============================================
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

# ============================================
# Licenses - Ensure compatible licenses
# ============================================
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ============================================
# Bans - Disallow specific crates or versions
# ============================================
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Crates to skip when checking for duplicate versions
skip = []

# Crates to skip checking duplicate versions for the entire tree
skip-tree = []

# Deny specific crates known to have security issues or are unmaintained
deny = [
    # Unmaintained crates
    { name = "atty", wrappers = [] },

    # Crates with known security issues (add as needed)
    # { name = "vulnerable-crate", version = "<1.2.3" },
]

# ============================================
# Sources - Restrict where crates come from
# ============================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Allow crates from specific GitHub organizations if needed
github = []
