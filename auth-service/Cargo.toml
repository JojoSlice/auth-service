[package]
name = "auth_service"
version = "0.1.0"
edition = "2021"
description = "OAuth Authentication Service with Google and GitHub support"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }

# OAuth & Authentication
oauth2 = "4.4"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "9"

# Security
argon2 = "0.5"
secrecy = { version = "0.8", features = ["serde"] }
tower_governor = "0.3"
aes-gcm = "0.10"
base64 = "0.21"
ipnetwork = "0.20"
rand = "0.8"
sha2 = "0.10"

# Serialization & Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.14"
dotenvy = "0.15"

# Utilities
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
dashmap = "5"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
axum-test = "14"
wiremock = "0.6"
